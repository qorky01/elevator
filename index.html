<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>엘리베이터 마스터 V6 - 시윤 엔지니어용</title>
    <style>
        :root {
            --metal: linear-gradient(145deg, #bdc3c7, #2c3e50);
            --industrial-yellow: #f1c40f;
            --danger-red: #e74c3c;
            --led-red: #ff3e3e;
            --panel-bg: #ecf0f1;
            --stripe: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 10px, #000 10px, #000 20px);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            font-family: -apple-system, sans-serif;
            background-color: #1a1a1a; overflow: hidden;
            color: #2c3e50; touch-action: manipulation;
        }

        #app {
            display: flex; flex-direction: column;
            width: 100%; height: 100%; box-sizing: border-box;
        }

        /* --- 상단: 엘리베이터 시각화 (고정 높이) --- */
        .view-pane {
            flex: 0 0 35%; background: #2d3436;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; border-bottom: 4px solid #000;
        }

        #car-lighting-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0); pointer-events: none; transition: background 0.5s; z-index: 5;
        }
        .light-off #car-lighting-overlay { background: rgba(0,0,0,0.9); }

        .display-unit {
            width: 120px; height: 60px; background: #000; border: 2px solid #95a5a6;
            border-radius: 5px; margin-bottom: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 6;
        }
        .floor-num { font-family: 'Courier New', monospace; font-size: 2.5rem; color: var(--led-red); line-height: 1; }
        .dir-icon { font-size: 1rem; color: var(--led-red); }

        .door-system {
            width: 180px; height: 140px; background: #000; border: 5px solid #7f8c8d;
            position: relative; overflow: hidden; z-index: 6;
        }
        .door {
            position: absolute; width: 50%; height: 100%;
            background: linear-gradient(90deg, #dcdde1, #7f8c8d); border: 1px solid #2f3640;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .door-l { left: 0; } .door-r { right: 0; }
        .door-open .door-l { transform: translateX(-95%); }
        .door-open .door-r { transform: translateX(95%); }

        /* --- 중단: 모드 탭 --- */
        .tab-bar {
            display: flex; background: #34495e; padding: 5px; gap: 5px;
        }
        .tab-btn {
            flex: 1; padding: 12px; border: none; border-radius: 5px;
            font-weight: bold; background: #2c3e50; color: #95a5a6; font-size: 0.9rem;
        }
        .tab-btn.active { background: #ecf0f1; color: #2c3e50; }

        /* --- 하단: 컨트롤 패널 (유동 높이) --- */
        .control-pane {
            flex: 1; background: #bdc3c7; position: relative;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* 승객 모드 UI */
        #passenger-ui {
            padding: 10px; display: flex; flex-direction: column; height: 100%; box-sizing: border-box;
        }
        .floor-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1;
        }
        .floor-btn {
            background: #fff; border: 3px solid #7f8c8d; border-radius: 10px;
            font-size: 1.3rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 3px 0 #7f8c8d; display: flex; align-items: center; justify-content: center;
        }
        .floor-btn.active { border-color: var(--industrial-yellow); box-shadow: 0 0 10px var(--industrial-yellow); color: #d35400; }
        .floor-btn:active { transform: translateY(2px); box-shadow: none; }

        .comm-row {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; height: 60px;
        }

        /* 점검 모드 UI */
        #inspection-ui {
            display: none; padding: 10px; height: 100%; flex-direction: column; box-sizing: border-box;
            background: #2c3e50; color: #fff;
        }

        #control-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #7f8c8d, #2c3e50); z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.5s ease-in-out;
        }
        .keyhole {
            width: 70px; height: 70px; border-radius: 50%; background: #1a1a1a;
            border: 4px solid #bdc3c7; display: flex; align-items: center; justify-content: center;
        }

        .admin-panel {
            flex: 1; overflow-y: auto; padding-right: 5px;
        }
        .switch-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #1a1a1a; padding: 10px; margin-bottom: 6px; border-radius: 5px; border: 1px solid #34495e;
            font-size: 0.8rem;
        }
        .toggle-sw {
            width: 46px; height: 24px; background: #34495e; border-radius: 12px; position: relative;
        }
        .toggle-sw.on { background: #27ae60; }
        .toggle-sw::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
            background: #fff; border-radius: 50%; transition: 0.3s;
        }
        .toggle-sw.on::after { left: 24px; }

        .e-stop-btn {
            width: 100%; height: 60px; background: #c0392b; color: #fff; font-weight: bold;
            border: none; border-radius: 10px; margin-bottom: 10px; font-size: 1.2rem;
            box-shadow: 0 4px 0 #7f0000;
        }
        .e-stop-btn.pressed { background: #ff0000; box-shadow: none; transform: translateY(4px); }

        .system-log {
            height: 80px; background: #000; color: #2ecc71; font-family: monospace;
            font-size: 0.7rem; padding: 5px; overflow-y: auto; border: 1px solid #34495e;
        }

        /* 가로 모드 (태블릿) 대응 */
        @media (min-width: 768px) {
            #app { flex-direction: row; }
            .view-pane { flex: 1.2; border-bottom: none; border-right: 4px solid #000; }
            .control-pane { flex: 1; }
            .display-unit { width: 180px; height: 100px; }
            .floor-num { font-size: 4rem; }
            .door-system { width: 300px; height: 350px; }
        }

        /* 비밀번호 모달 */
        #pw-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center;
        }
        .pw-box { background: #ecf0f1; padding: 20px; border-radius: 15px; width: 260px; text-align: center; color: #2c3e50; }
        .pw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .pw-btn { height: 50px; font-size: 1.2rem; border-radius: 8px; border: 1px solid #bdc3c7; background: #fff; font-weight: bold; }
    </style>
</head>
<body>

<div id="app">
    <!-- 시뮬레이터부 -->
    <div class="view-pane" id="sim-view">
        <div id="car-lighting-overlay"></div>
        <div id="msg-estop" style="display:none; position:absolute; top:10px; background:red; color:white; padding:5px 20px; font-weight:bold; z-index:10; animation:blink 0.5s infinite;">비상 정지 (E-STOP)</div>
        <div id="msg-cartop" style="display:none; position:absolute; top:45px; background:var(--industrial-yellow); color:black; padding:5px 20px; font-weight:bold; z-index:10;">카 상부 작업 중</div>

        <div class="display-unit">
            <div id="d-dir" class="dir-icon">●</div>
            <div id="d-floor" class="floor-num">1</div>
        </div>
        <div id="d-frame" class="door-system">
            <div class="door door-l"></div>
            <div class="door door-r"></div>
        </div>
        <div id="sys-status" style="color:#bdc3c7; font-size:0.7rem; margin-top:8px;">SYSTEM READY</div>
    </div>

    <!-- 제어 패널부 -->
    <div class="control-pane">
        <div class="tab-bar">
            <button id="t-pass" class="tab-btn active" onclick="setMode('passenger')">승객 모드</button>
            <button id="t-insp" class="tab-btn" onclick="setMode('inspection')">점검 모드</button>
        </div>

        <!-- 승객 UI -->
        <div id="passenger-ui">
            <div class="floor-grid" id="floor-btns"></div>
            <div class="comm-row">
                <button class="floor-btn" onclick="handleDoor('open')">◀||▶</button>
                <button class="floor-btn" onclick="handleDoor('close')">▶||◀</button>
                <button class="floor-btn" style="background:#fad3cf; color:#c0392b;" onclick="emergencyCall()">🔔</button>
            </div>
        </div>

        <!-- 점검 UI -->
        <div id="inspection-ui">
            <div id="control-cover">
                <div class="keyhole" onclick="openPwModal()">
                    <div style="width:10px; height:25px; background:var(--industrial-yellow); border-radius:2px;"></div>
                </div>
                <p style="font-size:0.8rem; margin-top:10px; color:#bdc3c7;">ENGINEER KEY REQUIRED</p>
            </div>

            <div class="admin-panel">
                <button id="btn-estop" class="e-stop-btn" onclick="toggleEStop()">EMERGENCY STOP</button>
                
                <div class="switch-row">
                    <span>수동 운전 모드 (INSP)</span>
                    <div id="sw-manual" class="toggle-sw" onclick="toggleSwitch('sw-manual')"></div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                    <button class="floor-btn" style="background:#2980b9; color:white; height:60px;" onmousedown="moveManual('up')" onmouseup="stopManual()" ontouchstart="moveManual('up')" ontouchend="stopManual()">▲ UP</button>
                    <button class="floor-btn" style="background:#f1c40f; color:black; height:60px;" onmousedown="moveManual('down')" onmouseup="stopManual()" ontouchstart="moveManual('down')" ontouchend="stopManual()">▼ DOWN</button>
                </div>

                <div class="switch-row"><span>고속 운전 (HIGH SPEED)</span><div id="sw-speed" class="toggle-sw" onclick="toggleSwitch('sw-speed')"></div></div>
                <div class="switch-row"><span>도어 홀드 (DOOR HOLD)</span><div id="sw-hold" class="toggle-sw" onclick="toggleSwitch('sw-hold')"></div></div>
                <div class="switch-row"><span>카 내 조명 (LIGHT)</span><div id="sw-light" class="toggle-sw on" onclick="toggleSwitch('sw-light')"></div></div>
                <div class="switch-row"><span>카 내 팬 (FAN)</span><div id="sw-fan" class="toggle-sw" onclick="toggleSwitch('sw-fan')"></div></div>
                <div class="switch-row"><span>카 상부 점검</span><div id="sw-cartop" class="toggle-sw" onclick="toggleSwitch('sw-cartop')"></div></div>

                <div class="system-log" id="log-display"></div>
            </div>
        </div>
    </div>
</div>

<!-- 비밀번호 입력 창 -->
<div id="pw-modal">
    <div class="pw-box">
        <h3 style="margin-top:0;">ENGINEER ACCESS</h3>
        <input type="password" id="pw-input" readonly style="width:100%; height:40px; font-size:1.5rem; text-align:center; border:1px solid #bdc3c7;">
        <div class="pw-grid">
            <script>for(let i=1;i<=9;i++) document.write(`<button class="pw-btn" onclick="pressPw('${i}')">${i}</button>`);</script>
            <button class="pw-btn" onclick="pressPw('C')" style="background:#fab3ab;">C</button>
            <button class="pw-btn" onclick="pressPw('0')">0</button>
            <button class="pw-btn" onclick="checkPw()" style="background:#abfabc;">OK</button>
        </div>
        <button onclick="closePwModal()" style="margin-top:15px; border:none; background:none; text-decoration:underline;">CANCEL</button>
    </div>
</div>

<script>
    // --- 오디오 시스템 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let fanNode = null;

    function playSound(freq, dur, type='sine', vol=0.1) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    }

    function playFan(on) {
        if(on && !fanNode) {
            const buf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for(let i=0; i<audioCtx.sampleRate; i++) data[i] = Math.random() * 2 - 1;
            fanNode = audioCtx.createBufferSource(); fanNode.buffer = buf; fanNode.loop = true;
            const g = audioCtx.createGain(); g.gain.value = 0.02;
            fanNode.connect(g); g.connect(audioCtx.destination); fanNode.start();
        } else if(!on && fanNode) { fanNode.stop(); fanNode = null; }
    }

    // --- 엘리베이터 엔진 ---
    let state = {
        floor: 1, targets: new Set(), moving: false, doorOpen: false,
        unlocked: false, inspActive: false, eStop: false,
        highSpeed: false, doorHold: false
    };

    // 층 버튼 초기화 (1~15)
    const grid = document.getElementById('floor-btns');
    for(let i=15; i>=1; i--) {
        const b = document.createElement('button');
        b.className = 'floor-btn'; b.id = `f-${i}`; b.innerText = i;
        b.onclick = () => {
            if(state.inspActive || state.eStop) return;
            playSound(880, 0.1);
            state.targets.add(i);
            b.classList.add('active');
            if(!state.moving) moveLoop();
        };
        grid.appendChild(b);
    }

    async function moveLoop() {
        if(state.targets.size === 0 || state.eStop) { 
            state.moving = false; document.getElementById('d-dir').innerText = "●"; 
            return; 
        }
        state.moving = true;
        let next = Array.from(state.targets).sort((a,b) => Math.abs(a-state.floor) - Math.abs(b-state.floor))[0];

        while(state.floor !== next && !state.eStop) {
            if(state.doorOpen) await handleDoor('close');
            document.getElementById('d-dir').innerText = next > state.floor ? "▲" : "▼";
            await new Promise(r => setTimeout(r, state.highSpeed ? 700 : 1300));
            if(state.eStop) break;
            state.floor += next > state.floor ? 1 : -1;
            document.getElementById('d-floor').innerText = state.floor;
            playSound(60, 0.2, 'triangle', 0.05);
            if(state.targets.has(state.floor)) break;
        }

        state.moving = false;
        if(!state.eStop) {
            state.targets.delete(state.floor);
            document.getElementById(`f-${state.floor}`).classList.remove('active');
            playSound(523, 0.5); await handleDoor('open');
            setTimeout(() => { if(state.targets.size > 0) moveLoop(); }, 2500);
        }
    }

    async function handleDoor(cmd) {
        if(state.doorHold && cmd === 'close') return;
        const frame = document.getElementById('d-frame');
        playSound(150, 0.5, 'triangle', 0.05);
        if(cmd === 'open') { frame.classList.add('door-open'); state.doorOpen = true; }
        else { frame.classList.remove('door-open'); state.doorOpen = false; }
        return new Promise(r => setTimeout(r, 1000));
    }

    // --- 점검 및 보안 로직 ---
    function setMode(m) {
        // 보안 초기화: 승객 모드로 가면 점검창 잠그기
        state.unlocked = false;
        pwBuffer = "";
        document.getElementById('pw-input').value = "";
        document.getElementById('control-cover').style.transform = "translateX(0)";

        document.getElementById('passenger-ui').style.display = m === 'passenger' ? 'flex' : 'none';
        document.getElementById('inspection-ui').style.display = m === 'inspection' ? 'flex' : 'none';
        document.getElementById('t-pass').className = m === 'passenger' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('t-insp').className = m === 'inspection' ? 'tab-btn active' : 'tab-btn';
        
        if(m === 'passenger') addLog("SECURITY: PANEL LOCKED");
    }

    let pwBuffer = "";
    function openPwModal() { document.getElementById('pw-modal').style.display = 'flex'; }
    function closePwModal() { document.getElementById('pw-modal').style.display = 'none'; pwBuffer = ""; }
    function pressPw(n) { if(n==='C') pwBuffer = ""; else pwBuffer += n; document.getElementById('pw-input').value = "*".repeat(pwBuffer.length); playSound(600, 0.05); }
    function checkPw() {
        if(pwBuffer === "112") {
            state.unlocked = true;
            document.getElementById('control-cover').style.transform = "translateX(100%)";
            addLog("AUTH SUCCESS: HELLO SIYUN");
            closePwModal();
        } else { alert("WRONG CODE"); pwBuffer = ""; document.getElementById('pw-input').value = ""; }
    }

    // 점검반 기능
    function toggleEStop() {
        state.eStop = !state.eStop;
        playSound(200, 0.4, 'square', 0.2);
        document.getElementById('btn-estop').classList.toggle('pressed', state.eStop);
        document.getElementById('msg-estop').style.display = state.eStop ? 'block' : 'none';
        if(state.eStop) { 
            state.targets.clear(); 
            document.querySelectorAll('.floor-btn').forEach(b=>b.classList.remove('active'));
            addLog("EMERGENCY STOP!");
        }
    }

    function toggleSwitch(id) {
        const sw = document.getElementById(id);
        sw.classList.toggle('on');
        playSound(500, 0.1);
        const on = sw.classList.contains('on');
        if(id === 'sw-manual') {
            state.inspActive = on;
            document.getElementById('sys-status').innerText = on ? "INSPECTION MODE" : "NORMAL SERVICE";
            addLog(on ? "MANUAL DRIVE ENABLED" : "NORMAL MODE ACTIVE");
        } else if(id==='sw-speed') state.highSpeed = on;
        else if(id==='sw-hold') state.doorHold = on;
        else if(id==='sw-light') document.getElementById('sim-view').classList.toggle('light-off', !on);
        else if(id==='sw-fan') playFan(on);
        else if(id==='sw-cartop') document.getElementById('msg-cartop').style.display = on ? 'block' : 'none';
    }

    let mTimer;
    function moveManual(dir) {
        if(!state.inspActive || state.eStop) return;
        mTimer = setInterval(() => {
            if(dir==='up' && state.floor<15) state.floor++;
            if(dir==='down' && state.floor>1) state.floor--;
            document.getElementById('d-floor').innerText = state.floor;
            playSound(100, 0.1, 'square', 0.03);
        }, state.highSpeed ? 300 : 800);
    }
    function stopManual() { clearInterval(mTimer); }

    function addLog(msg) {
        const log = document.getElementById('log-display');
        log.innerHTML = `> ${msg}<br>` + log.innerHTML;
    }

    function emergencyCall() { playSound(440, 1, 'sawtooth'); alert("🚨 비상 벨: 관리실과 연결합니다."); }

    // 초기 실행
    addLog("SYSTEM BOOT COMPLETED");
    setMode('passenger');
</script>
</body>
</html>
