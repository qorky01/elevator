<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>엘리베이터 마스터 V8 - 유니버설 에디션</title>
    <style>
        :root {
            --metal: linear-gradient(145deg, #dcdde1, #7f8c8d);
            --industrial: #f1c40f;
            --led: #ff3e3e;
            --bg: #121212;
            --panel: #bdc3c7;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            font-family: -apple-system, sans-serif;
            background-color: var(--bg); overflow: hidden;
            color: #2c3e50; touch-action: manipulation;
        }

        /* 메인 레이아웃: 가로/세로 유동적 변경 */
        #app {
            display: flex; flex-direction: column;
            width: 100%; height: 100%; box-sizing: border-box;
            padding: 5px; gap: 5px;
        }

        @media (orientation: landscape) {
            #app { flex-direction: row; }
        }

        /* --- 좌측/상단: 시각화 영역 --- */
        .view-pane {
            flex: 1.2; background: #2d3436; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; border: 3px solid #000;
        }

        #lighting-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0); pointer-events: none; transition: 0.5s; z-index: 5;
        }
        .light-off #lighting-overlay { background: rgba(0,0,0,0.9); }

        .display {
            width: clamp(100px, 20vw, 180px); height: clamp(60px, 12vh, 100px);
            background: #000; border: 2px solid #95a5a6; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 10px; z-index: 6;
        }
        .floor-num { font-family: 'Courier New', monospace; font-size: clamp(2.5rem, 8vh, 4.5rem); color: var(--led); line-height: 1; }
        .dir-icon { font-size: 1.2rem; color: var(--led); }

        .elevator-frame {
            width: clamp(160px, 35vw, 320px); height: clamp(200px, 45vh, 480px);
            background: #000; border: clamp(4px, 1vw, 10px) solid #7f8c8d;
            position: relative; overflow: hidden; z-index: 6;
        }
        .door {
            position: absolute; width: 50%; height: 100%;
            background: var(--metal); border: 1px solid #2f3640;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .door-l { left: 0; border-right: 2px solid #334155; }
        .door-r { right: 0; border-left: 2px solid #334155; }
        .door-open .door-l { transform: translateX(-95%); }
        .door-open .door-r { transform: translateX(95%); }

        .status-tag { position: absolute; bottom: 10px; color: #7f8c8d; font-size: 0.7rem; }

        /* --- 우측/하단: 제어 영역 --- */
        .control-pane {
            flex: 1; background: var(--panel); border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden; border: 3px solid #475569;
        }

        .tab-bar { display: flex; background: #34495e; padding: 4px; gap: 4px; }
        .tab-btn {
            flex: 1; padding: clamp(10px, 2vh, 18px); border: none; border-radius: 6px;
            font-weight: bold; font-size: 0.9rem; background: #2c3e50; color: #95a5a6;
        }
        .tab-btn.active { background: #ecf0f1; color: #2c3e50; }

        .ui-content { flex: 1; padding: 10px; display: flex; flex-direction: column; position: relative; }

        /* 층수 버튼 그리드 */
        .floor-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex: 1;
        }
        .btn {
            background: #fff; border: 2px solid #7f8c8d; border-radius: 8px;
            font-size: clamp(1.1rem, 3vh, 1.6rem); font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #7f8c8d; display: flex; align-items: center; justify-content: center;
        }
        .btn.active { border-color: #d35400; box-shadow: 0 0 10px #e67e22; color: #e67e22; }
        .btn:active { transform: translateY(2px); box-shadow: none; }

        .special-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; height: clamp(50px, 8vh, 70px); margin-top: 10px; }

        /* 점검 패널 UI */
        #inspection-ui { display: none; background: #2c3e50; color: white; height: 100%; flex-direction: column; }
        #cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #7f8c8d, #2c3e50); z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.5s;
        }
        .keyhole {
            width: 80px; height: 80px; border-radius: 50%; background: #1a1a1a;
            border: 5px solid #bdc3c7; display: flex; align-items: center; justify-content: center;
        }

        .scroll-area { flex: 1; overflow-y: auto; padding-right: 5px; }
        .sw-box {
            display: flex; justify-content: space-between; align-items: center;
            background: #1a1a1a; padding: 10px; margin-bottom: 5px; border-radius: 6px; font-size: 0.8rem;
        }
        .toggle { width: 44px; height: 24px; background: #34495e; border-radius: 12px; position: relative; transition: 0.3s; }
        .toggle.on { background: #27ae60; }
        .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: 0.3s; }
        .toggle.on::after { left: 22px; }

        .estop { background: #c0392b; color: #fff; width: 100%; height: 50px; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
        .estop.pressed { background: red; animation: blink 0.5s infinite; }

        .log { height: 80px; background: #000; color: #2ecc71; font-family: monospace; font-size: 0.7rem; padding: 5px; border-radius: 4px; overflow-y: auto; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* 비밀번호 모달 */
        #pw-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center;
        }
        .pw-box { background: #ecf0f1; padding: 20px; border-radius: 15px; width: 280px; text-align: center; }
        .pw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .pw-btn { height: 55px; font-size: 1.3rem; font-weight: bold; border: 1px solid #bdc3c7; border-radius: 8px; background: #fff; }
    </style>
</head>
<body>

<div id="app">
    <!-- 비주얼 영역 -->
    <div class="view-pane" id="sim-view">
        <div id="lighting-overlay"></div>
        <div id="estop-msg" style="display:none; position:absolute; top:15px; background:red; color:white; padding:5px 15px; border-radius:5px; font-weight:bold; z-index:15;">EMERGENCY STOP</div>
        
        <div class="display">
            <div id="d-dir" class="dir-icon">●</div>
            <div id="d-floor" class="floor-num">1</div>
        </div>

        <div id="d-frame" class="elevator-frame">
            <div class="door door-l"></div>
            <div class="door door-r"></div>
        </div>
        <div class="status-tag" id="status-text">SYSTEM READY</div>
    </div>

    <!-- 제어 영역 -->
    <div class="control-pane">
        <div class="tab-bar">
            <button id="t-pass" class="tab-btn active" onclick="setMode('passenger')">승객 모드</button>
            <button id="t-insp" class="tab-btn" onclick="setMode('inspection')">점검 모드</button>
        </div>

        <div class="ui-content">
            <!-- 승객 UI -->
            <div id="passenger-ui" style="display: flex; flex-direction: column; height: 100%;">
                <div class="floor-grid" id="btns"></div>
                <div class="special-row">
                    <button class="btn" onclick="doorRequest('open')">◀||▶</button>
                    <button class="btn" onclick="doorRequest('close')">▶||◀</button>
                    <button class="btn" style="background:#fad3cf; color:#c0392b;" onclick="emergencyBell()">🔔</button>
                </div>
            </div>

            <!-- 점검 UI -->
            <div id="inspection-ui">
                <div id="cover">
                    <div class="keyhole" onclick="openPw()">
                        <div style="width:10px; height:25px; background:var(--industrial); border-radius:2px;"></div>
                    </div>
                    <p style="color:#bdc3c7; font-size:0.8rem; margin-top:15px;">ENGINEER KEY REQUIRED</p>
                </div>
                <div class="scroll-area">
                    <button id="estop-btn" class="estop" onclick="toggleEstop()">SYSTEM E-STOP</button>
                    <div class="sw-box"><span>점검 운전 (INSP)</span><div id="sw-insp" class="toggle" onclick="toggleSw('sw-insp')"></div></div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
                        <button class="btn" style="background:#2980b9; color:#fff; height:60px;" onmousedown="manualMove('up')" onmouseup="stopManual()" ontouchstart="manualMove('up')" ontouchend="stopManual()">▲ UP</button>
                        <button class="btn" style="background:var(--industrial); color:#000; height:60px;" onmousedown="manualMove('down')" onmouseup="stopManual()" ontouchstart="manualMove('down')" ontouchend="stopManual()">▼ DOWN</button>
                    </div>
                    <div class="sw-box"><span>고속 운전</span><div id="sw-speed" class="toggle" onclick="toggleSw('sw-speed')"></div></div>
                    <div class="sw-box"><span>도어 홀드 (BYPASS)</span><div id="sw-hold" class="toggle" onclick="toggleSw('sw-hold')"></div></div>
                    <div class="sw-box"><span>카 내 조명</span><div id="sw-light" class="toggle on" onclick="toggleSw('sw-light')"></div></div>
                    <div class="sw-box"><span>카 내 팬</span><div id="sw-fan" class="toggle" onclick="toggleSw('sw-fan')"></div></div>
                    <div class="log" id="log-box"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 비밀번호 모달 -->
<div id="pw-modal">
    <div class="pw-box">
        <h3>ENGINEER AUTH</h3>
        <input type="password" id="pw-input" readonly class="pw-btn" style="width:100%; border:1px solid #bdc3c7; margin-bottom:10px; font-size:1.8rem;">
        <div class="pw-grid">
            <script>for(let i=1;i<=9;i++) document.write(`<button class="pw-btn" onclick="pressPw('${i}')">${i}</button>`);</script>
            <button class="pw-btn" onclick="pressPw('C')" style="background:#fab3ab;">C</button>
            <button class="pw-btn" onclick="pressPw('0')">0</button>
            <button class="pw-btn" onclick="checkPw()" style="background:#abfabc;">OK</button>
        </div>
        <button onclick="closePw()" style="margin-top:15px; background:none; border:none; text-decoration:underline;">CANCEL</button>
    </div>
</div>

<script>
    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, d, t='sine', v=0.1) {
        const o = audio.createOscillator(); const g = audio.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(v, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + d);
        o.connect(g); g.connect(audio.destination);
        o.start(); o.stop(audio.currentTime + d);
    }

    let state = {
        floor: 1, targets: new Set(), moving: false, doorOpen: false,
        unlocked: false, insp: false, estop: false,
        speed: false, hold: false
    };

    // 버튼 생성 (15~1층)
    const grid = document.getElementById('btns');
    for(let i=15; i>=1; i--) {
        const b = document.createElement('button');
        b.className = 'btn'; b.id = `f-${i}`; b.innerText = i;
        b.onclick = () => {
            if(state.insp || state.estop) return;
            if(state.floor === i && !state.moving) { doorAction('open'); return; }
            if(state.targets.has(i)) {
                state.targets.delete(i); b.classList.remove('active'); beep(440, 0.05);
            } else {
                state.targets.add(i); b.classList.add('active'); beep(880, 0.1);
            }
            if(!state.moving && state.targets.size > 0) drive();
        };
        grid.appendChild(b);
    }

    async function drive() {
        if(state.targets.size === 0 || state.estop) { 
            state.moving = false; document.getElementById('d-dir').innerText = "●"; 
            return; 
        }
        state.moving = true;
        // 이동 시작 시 문 닫기 (도어 홀드 아닐 때)
        if(!state.hold && state.doorOpen) await doorAction('close');

        while(state.targets.size > 0 && !state.estop) {
            let next = Array.from(state.targets).sort((a,b) => Math.abs(a-state.floor) - Math.abs(b-state.floor))[0];
            if(state.floor === next) { state.targets.delete(next); continue; }
            
            document.getElementById('d-dir').innerText = next > state.floor ? "▲" : "▼";
            await new Promise(r => setTimeout(r, state.speed ? 600 : 1200));
            if(state.estop) break;
            
            state.floor += next > state.floor ? 1 : -1;
            document.getElementById('d-floor').innerText = state.floor;
            beep(100, 0.1, 'square', 0.03);

            if(state.targets.has(state.floor)) {
                state.moving = false;
                state.targets.delete(state.floor);
                document.getElementById(`f-${state.floor}`).classList.remove('active');
                beep(523, 0.4);
                await doorAction('open');
                await new Promise(r => setTimeout(r, 2500));
                if(state.targets.size > 0 && !state.estop) {
                    if(!state.hold) await doorAction('close');
                    state.moving = true;
                }
            }
        }
        state.moving = false;
        document.getElementById('d-dir').innerText = "●";
    }

    async function doorAction(cmd) {
        if(state.hold && cmd === 'close') return;
        if(state.moving && !state.insp && cmd === 'open') return; // 주행 중 열림 방지
        const f = document.getElementById('d-frame');
        beep(150, 0.5, 'triangle', 0.05);
        if(cmd === 'open') { f.classList.add('door-open'); state.doorOpen = true; }
        else { f.classList.remove('door-open'); state.doorOpen = false; }
        return new Promise(r => setTimeout(r, 800));
    }

    function doorRequest(cmd) { if(!state.estop) doorAction(cmd); }

    function setMode(m) {
        state.unlocked = false;
        document.getElementById('cover').style.transform = "translateX(0)";
        document.getElementById('passenger-ui').style.display = m === 'passenger' ? 'flex' : 'none';
        document.getElementById('inspection-ui').style.display = m === 'inspection' ? 'flex' : 'none';
        document.getElementById('t-pass').className = m === 'passenger' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('t-insp').className = m === 'inspection' ? 'tab-btn active' : 'tab-btn';
    }

    let pwBuf = "";
    function openPw() { document.getElementById('pw-modal').style.display = 'flex'; }
    function closePw() { document.getElementById('pw-modal').style.display = 'none'; pwBuf = ""; document.getElementById('pw-input').value = ""; }
    function pressPw(n) { if(n==='C') pwBuf=""; else pwBuf+=n; document.getElementById('pw-input').value = "*".repeat(pwBuf.length); beep(600, 0.05); }
    function checkPw() {
        if(pwBuf === "112") {
            state.unlocked = true; document.getElementById('cover').style.transform = "translateX(100%)";
            addLog("AUTH SUCCESS: HELLO SIYUN"); closePw();
        } else { alert("WRONG KEY"); pwBuf = ""; document.getElementById('pw-input').value = ""; }
    }

    function toggleEstop() {
        state.estop = !state.estop; beep(200, 0.4, 'square', 0.2);
        document.getElementById('estop-btn').classList.toggle('pressed', state.estop);
        document.getElementById('estop-msg').style.display = state.estop ? 'block' : 'none';
        if(state.estop) { state.targets.clear(); document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active')); addLog("E-STOP ACTIVE"); }
    }

    function toggleSw(id) {
        const sw = document.getElementById(id); sw.classList.toggle('on'); beep(500, 0.1);
        const on = sw.classList.contains('on');
        if(id === 'sw-insp') { state.insp = on; document.getElementById('status-text').innerText = on ? "INSPECTION MODE" : "SYSTEM READY"; }
        else if(id === 'sw-speed') state.speed = on;
        else if(id === 'sw-hold') state.hold = on;
        else if(id === 'sw-light') document.getElementById('sim-view').classList.toggle('light-off', !on);
        else if(id === 'sw-fan') addLog(on ? "FAN ON" : "FAN OFF");
    }

    let mTimer;
    async function manualMove(dir) {
        if(!state.insp || state.estop) return;
        if(!state.hold && state.doorOpen) await doorAction('close');
        mTimer = setInterval(() => {
            if(dir==='up' && state.floor<15) state.floor++;
            if(dir==='down' && state.floor>1) state.floor--;
            document.getElementById('d-floor').innerText = state.floor;
            beep(120, 0.1, 'square', 0.03);
        }, state.speed ? 300 : 800);
    }
    function stopManual() { clearInterval(mTimer); }
    function addLog(msg) { const l = document.getElementById('log-box'); l.innerHTML = `> ${msg}<br>` + l.innerHTML; }
    function emergencyBell() { beep(440, 1, 'sawtooth'); alert("🚨 비상 벨: 관리실로 연결합니다."); }

    addLog("SYSTEM V8 READY");
</script>
</body>
</html>
