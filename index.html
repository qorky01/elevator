<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>엘리베이터 마스터 V5 - 시윤 엔지니어용</title>
    <style>
        :root {
            --metal: linear-gradient(145deg, #95a5a6, #2c3e50);
            --industrial-yellow: #f1c40f;
            --danger-red: #e74c3c;
            --led-red: #ff3e3e;
            --stripe: repeating-linear-gradient(45deg, #f1c40f, #f1c40f 10px, #000 10px, #000 20px);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #0b0e14; overflow: hidden;
            color: white; touch-action: manipulation;
        }

        #app {
            display: flex;
            width: 100%; height: 100%;
            padding: 10px; box-sizing: border-box;
            gap: 10px;
        }

        /* --- 레이아웃 분할 --- */
        .pane {
            border-radius: 15px; border: 4px solid #475569;
            position: relative; display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* 좌측: 시뮬레이터 */
        .view-pane {
            flex: 1.2; background: #1e293b;
            align-items: center; justify-content: center;
        }

        /* 우측: 제어 패널 */
        .control-pane {
            flex: 1; background: #94a3b8;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }

        /* 아이폰/세로 모드 대응 */
        @media (max-width: 768px) {
            #app { flex-direction: column; }
            .view-pane { flex: 1; }
            .control-pane { flex: 1.5; }
            .floor-num { font-size: 3.5rem !important; }
            .door-system { width: 200px !important; height: 300px !important; }
        }

        /* --- 시뮬레이터 내부 요소 --- */
        #car-lighting-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0); pointer-events: none; transition: background 0.5s; z-index: 5;
        }
        .light-off #car-lighting-overlay { background: rgba(0,0,0,0.9); }

        .display-unit {
            width: 160px; height: 90px; background: #000; border: 3px solid #94a3b8;
            border-radius: 10px; margin-bottom: 15px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 6;
        }

        .floor-num { font-family: 'Courier New', monospace; font-size: 4.5rem; color: var(--led-red); line-height: 1; }
        .dir-icon { font-size: 1.2rem; color: var(--led-red); }

        .door-system {
            width: 260px; height: 380px; background: #0f172a; border: 8px solid #64748b;
            position: relative; overflow: hidden; z-index: 6;
        }

        .door {
            position: absolute; width: 50%; height: 100%;
            background: linear-gradient(90deg, #cbd5e1, #94a3b8); border: 1px solid #475569;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .door-l { left: 0; border-right: 2px solid #334155; }
        .door-r { right: 0; border-left: 2px solid #334155; }
        .door-open .door-l { transform: translateX(-95%); }
        .door-open .door-r { transform: translateX(95%); }

        .warning-overlay {
            position: absolute; top: 10px; width: 90%; padding: 8px;
            background: var(--danger-red); color: white; text-align: center;
            font-weight: bold; font-size: 0.9rem; border-radius: 5px;
            display: none; z-index: 10; animation: blink 0.5s infinite;
        }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- 제어반 UI --- */
        .tab-bar { display: flex; background: #334155; padding: 5px; gap: 5px; }
        .tab-btn {
            flex: 1; padding: 12px 5px; border: none; border-radius: 6px;
            font-weight: bold; font-size: 0.9rem; cursor: pointer; background: #475569; color: #94a3b8;
        }
        .tab-btn.active { background: #cbd5e1; color: #1e293b; }

        #passenger-ui, #inspection-ui {
            padding: 10px; flex: 1; display: flex; flex-direction: column; overflow-y: auto;
        }

        .floor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .floor-btn {
            aspect-ratio: 1/1; border-radius: 50%; background: #f8fafc;
            border: 4px solid #64748b; font-size: 1.4rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #475569; display: flex; align-items: center; justify-content: center;
        }
        .floor-btn.active { border-color: #fbbf24; box-shadow: 0 0 10px #fbbf24; color: #d97706; }
        .floor-btn:active { transform: translateY(2px); box-shadow: none; }

        /* --- 점검 패널 내부 --- */
        #control-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #475569, #1e293b); z-index: 20;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.5s ease-in-out;
        }

        .admin-panel {
            background: #334155; border: 4px solid var(--industrial-yellow);
            padding: 10px; border-radius: 8px; color: white;
        }

        .switch-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f172a; padding: 8px 12px; margin-bottom: 6px; border-radius: 6px;
            font-size: 0.8rem; border: 1px solid #475569;
        }

        .toggle-sw {
            width: 44px; height: 24px; background: #475569; border-radius: 12px;
            position: relative; cursor: pointer; transition: 0.3s;
        }
        .toggle-sw.on { background: #22c55e; }
        .toggle-sw::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: 0.3s;
        }
        .toggle-sw.on::after { left: 22px; }

        .e-stop-btn {
            width: 80px; height: 80px; border-radius: 50%; background: #c53030;
            border: 6px solid #742a2a; color: white; font-weight: bold;
            box-shadow: 0 5px 0 #63171b; margin-bottom: 10px;
        }
        .e-stop-btn.pressed { transform: translateY(4px); box-shadow: none; background: red; }

        .system-log {
            margin-top: 10px; background: #000; color: #22c55e; padding: 8px;
            height: 80px; overflow-y: auto; font-family: monospace; font-size: 0.7rem;
            border: 1px solid #475569;
        }

        /* --- 비밀번호 모달 --- */
        #key-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center;
        }
        .keypad-box { background: #cbd5e1; padding: 15px; border-radius: 15px; width: 240px; text-align: center; color: #1e293b; }
        .key-input { width: 100%; height: 40px; font-size: 1.5rem; text-align: center; margin-bottom: 10px; border-radius: 5px; border: 1px solid #475569; }
        .key-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .k-btn { height: 45px; font-size: 1.2rem; font-weight: bold; border-radius: 5px; border: 1px solid #94a3b8; background: #f8fafc; }
    </style>
</head>
<body class="light-on">

<div id="app">
    <!-- 시뮬레이터 창 -->
    <div class="pane view-pane" id="sim-view">
        <div id="car-lighting-overlay"></div>
        <div id="warning-msg" class="warning-overlay">🚨 EMERGENCY STOP ACTIVE</div>
        
        <div class="display-unit">
            <div id="d-dir" class="dir-icon">●</div>
            <div id="d-floor" class="floor-num">1</div>
        </div>
        
        <div id="d-frame" class="door-system">
            <div class="door door-l"></div>
            <div class="door door-r"></div>
        </div>
        <div id="sys-status" style="font-size: 0.7rem; margin-top: 5px; color: #94a3b8;">SYSTEM: NORMAL</div>
    </div>

    <!-- 제어반 창 -->
    <div class="pane control-pane">
        <div class="tab-bar">
            <button id="t-pass" class="tab-btn active" onclick="setMode('passenger')">승객 모드</button>
            <button id="t-insp" class="tab-btn" onclick="setMode('inspection')">점검 모드</button>
        </div>

        <!-- 승객 UI -->
        <div id="passenger-ui">
            <div class="floor-grid" id="floor-container"></div>
            <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-top:10px;">
                <button class="floor-btn" style="border-radius:8px; aspect-ratio: auto; height:50px;" onclick="handleDoor('open')">◀||▶</button>
                <button class="floor-btn" style="border-radius:8px; aspect-ratio: auto; height:50px;" onclick="handleDoor('close')">▶||◀</button>
                <button class="floor-btn" style="border-radius:8px; aspect-ratio: auto; height:50px; background:#fee2e2; color:#b91c1c;" onclick="emergencyCall()">🔔</button>
            </div>
        </div>

        <!-- 점검 UI -->
        <div id="inspection-ui">
            <div id="control-cover">
                <div style="width:60px; height:60px; border-radius:50%; background:#1e293b; border:4px solid #94a3b8; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="openKeyModal()">
                    <div style="width:8px; height:20px; background:#f1c40f; border-radius:2px;"></div>
                </div>
                <p style="color:#94a3b8; font-size:0.7rem; margin-top:10px;">KEY LOCK: ENGINEER ONLY</p>
            </div>

            <div class="admin-panel">
                <div style="text-align:center;">
                    <button id="e-stop" class="e-stop-btn" onclick="toggleEStop()">E-STOP</button>
                </div>
                <div class="switch-row">
                    <span>INSPECTION MODE</span>
                    <div id="sw-manual" class="toggle-sw" onclick="toggleSwitch('sw-manual')"></div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin: 5px 0;">
                    <button class="floor-btn" style="aspect-ratio:auto; height:50px; background:#2563eb; color:white;" onmousedown="moveManual('up')" onmouseup="stopManual()" ontouchstart="moveManual('up')" ontouchend="stopManual()">▲ UP</button>
                    <button class="floor-btn" style="aspect-ratio:auto; height:50px; background:#eab308; color:black;" onmousedown="moveManual('down')" onmouseup="stopManual()" ontouchstart="moveManual('down')" ontouchend="stopManual()">▼ DOWN</button>
                </div>
                <div class="switch-row"><span>HIGH SPEED</span><div id="sw-speed" class="toggle-sw" onclick="toggleSwitch('sw-speed')"></div></div>
                <div class="switch-row"><span>DOOR HOLD</span><div id="sw-hold" class="toggle-sw" onclick="toggleSwitch('sw-hold')"></div></div>
                <div class="switch-row"><span>LIGHT</span><div id="sw-light" class="toggle-sw on" onclick="toggleSwitch('sw-light')"></div></div>
                <div class="switch-row"><span>FAN</span><div id="sw-fan" class="toggle-sw" onclick="toggleSwitch('sw-fan')"></div></div>
                <div class="system-log" id="log-display"></div>
            </div>
        </div>
    </div>
</div>

<!-- 키패드 모달 -->
<div id="key-modal">
    <div class="keypad-box">
        <h3 style="margin:0 0 10px 0;">ENGINEER KEY</h3>
        <input type="password" id="key-field" readonly class="key-input" placeholder="PASSCODE">
        <div class="key-grid">
            <script>for(let i=1;i<=9;i++) document.write(`<button class="k-btn" onclick="pressKey('${i}')">${i}</button>`);</script>
            <button class="k-btn" onclick="pressKey('C')" style="background:#fca5a5;">C</button>
            <button class="k-btn" onclick="pressKey('0')">0</button>
            <button class="k-btn" onclick="checkAuth()" style="background:#86efac;">OK</button>
        </div>
        <button onclick="closeKeyModal()" style="margin-top:10px; border:none; background:none; text-decoration:underline;">CANCEL</button>
    </div>
</div>

<script>
    // --- 오디오 엔진 ---
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let fanNode = null;
    let moveNode = null;

    function soundEffect(f, d, t='sine', v=0.1) {
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(v, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + d);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + d);
    }

    function playFan(on) {
        if(on && !fanNode) {
            const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
            const data = buf.getChannelData(0);
            for(let i=0; i<ctx.sampleRate; i++) data[i] = Math.random() * 2 - 1;
            fanNode = ctx.createBufferSource(); fanNode.buffer = buf; fanNode.loop = true;
            const g = ctx.createGain(); g.gain.value = 0.03;
            fanNode.connect(g); g.connect(ctx.destination); fanNode.start();
        } else if(!on && fanNode) { fanNode.stop(); fanNode = null; }
    }

    // --- 상태 엔진 ---
    let state = {
        floor: 1, targets: new Set(), moving: false, doorOpen: false,
        unlocked: false, inspActive: false, eStop: false,
        highSpeed: false, doorHold: false, light: true
    };

    // 버튼 생성
    const container = document.getElementById('floor-container');
    for(let i=15; i>=1; i--) {
        const b = document.createElement('button');
        b.className = 'floor-btn'; b.id = `f-${i}`; b.innerText = i;
        b.onclick = () => {
            if(state.inspActive || state.eStop) return;
            soundEffect(880, 0.1);
            state.targets.add(i);
            b.classList.add('active');
            if(!state.moving) moveLoop();
        };
        container.appendChild(b);
    }

    async function moveLoop() {
        if(state.targets.size === 0 || state.eStop) { 
            state.moving = false; document.getElementById('d-dir').innerText = "●";
            return; 
        }
        state.moving = true;
        let next = Array.from(state.targets).sort((a,b) => Math.abs(a-state.floor) - Math.abs(b-state.floor))[0];

        while(state.floor !== next && !state.eStop) {
            if(state.doorOpen) await handleDoor('close');
            document.getElementById('d-dir').innerText = next > state.floor ? "▲" : "▼";
            await new Promise(r => setTimeout(r, state.highSpeed ? 700 : 1300));
            if(state.eStop) break;
            state.floor += next > state.floor ? 1 : -1;
            document.getElementById('d-floor').innerText = state.floor;
            soundEffect(60, 0.2, 'triangle', 0.05);
            if(state.targets.has(state.floor)) break;
        }

        state.moving = false;
        if(!state.eStop) {
            state.targets.delete(state.floor);
            document.getElementById(`f-${state.floor}`).classList.remove('active');
            soundEffect(523, 0.5); await handleDoor('open');
            setTimeout(() => { if(state.targets.size > 0) moveLoop(); }, 2500);
        }
    }

    async function handleDoor(cmd) {
        if(state.doorHold && cmd === 'close') return;
        const frame = document.getElementById('d-frame');
        soundEffect(150, 0.5, 'triangle', 0.05);
        if(cmd === 'open') { frame.classList.add('door-open'); state.doorOpen = true; }
        else { frame.classList.remove('door-open'); state.doorOpen = false; }
        return new Promise(r => setTimeout(r, 1100));
    }

    // --- 점검 및 보안 로직 (핵심) ---
    let keyBuffer = "";

    function setMode(m) {
        // 공통: 점검 모드 덮개 닫기 및 보안 리셋
        state.unlocked = false;
        keyBuffer = "";
        document.getElementById('key-field').value = "";
        document.getElementById('control-cover').style.transform = "translateX(0)";

        if(m === 'passenger') {
            document.getElementById('passenger-ui').style.display = 'flex';
            document.getElementById('inspection-ui').style.display = 'none';
            document.getElementById('t-pass').classList.add('active');
            document.getElementById('t-insp').classList.remove('active');
            addLog("SECURITY LOCK: RESET SUCCESS");
        } else {
            document.getElementById('passenger-ui').style.display = 'none';
            document.getElementById('inspection-ui').style.display = 'flex';
            document.getElementById('t-pass').classList.remove('active');
            document.getElementById('t-insp').classList.add('active');
        }
    }

    function openKeyModal() { document.getElementById('key-modal').style.display = 'flex'; }
    function closeKeyModal() { document.getElementById('key-modal').style.display = 'none'; keyBuffer = ""; document.getElementById('key-field').value = ""; }
    function pressKey(k) {
        if(k==='C') keyBuffer = ""; else keyBuffer += k;
        document.getElementById('key-field').value = "*".repeat(keyBuffer.length);
        soundEffect(600, 0.05);
    }

    function checkAuth() {
        if(keyBuffer === "112") {
            state.unlocked = true;
            document.getElementById('control-cover').style.transform = "translateX(100%)";
            addLog("ENGINEER AUTHENTICATED: SIYUN");
            soundEffect(400, 0.2, 'square');
            closeKeyModal();
        } else {
            alert("WRONG CODE!");
            keyBuffer = ""; document.getElementById('key-field').value = "";
        }
    }

    // --- 부가 기능 ---
    function toggleEStop() {
        state.eStop = !state.eStop;
        soundEffect(200, 0.3, 'square', 0.2);
        document.getElementById('e-stop').classList.toggle('pressed', state.eStop);
        document.getElementById('warning-msg').style.display = state.eStop ? 'block' : 'none';
        if(state.eStop) { 
            state.targets.clear(); 
            document.querySelectorAll('.floor-btn').forEach(b=>b.classList.remove('active'));
            addLog("!!! E-STOP TRIGGERED !!!");
        }
    }

    function toggleSwitch(id) {
        const sw = document.getElementById(id);
        sw.classList.toggle('on');
        soundEffect(500, 0.1);
        const on = sw.classList.contains('on');
        
        if(id==='sw-manual') {
            state.inspActive = on;
            document.getElementById('sys-status').innerText = on ? "MODE: INSPECTION" : "MODE: NORMAL";
            addLog(on ? "INSPECTION ACTIVE" : "NORMAL RECOVERY");
        } else if(id==='sw-speed') state.highSpeed = on;
        else if(id==='sw-hold') state.doorHold = on;
        else if(id==='sw-light') document.getElementById('sim-view').classList.toggle('light-off', !on);
        else if(id==='sw-fan') playFan(on);
    }

    let mTimer;
    function moveManual(dir) {
        if(!state.inspActive || state.eStop) return;
        mTimer = setInterval(() => {
            if(dir==='up' && state.floor<15) state.floor++;
            if(dir==='down' && state.floor>1) state.floor--;
            document.getElementById('d-floor').innerText = state.floor;
            soundEffect(100, 0.1, 'square', 0.03);
        }, state.highSpeed ? 300 : 700);
    }
    function stopManual() { clearInterval(mTimer); }

    function addLog(msg) {
        const log = document.getElementById('log-display');
        log.innerHTML = `> ${msg}<br>` + log.innerHTML;
    }

    function emergencyCall() { soundEffect(440, 1, 'sawtooth'); alert("🚨 비상 통화 연결 중..."); }

    addLog("SYSTEM BOOT COMPLETED");
</script>
</body>
</html>
